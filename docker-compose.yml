services:
  # cds runs as a non-root user (distroless) and can't chown/chmod the
  # export-data volume itself, so a tiny one-shot init container prepares
  # it first. Without this, exporting a real certificate (as opposed to
  # the redacted placeholder in examples/acme.sample.json) fails with a
  # permission error the first time the volume is created.
  export-init:
    image: busybox
    command: sh -c "mkdir -p /data/export && chmod -R 0777 /data/export"
    volumes:
      - export-data:/data/export

  cds:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      export-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
      ACME_FILE: "/data/acme.json"
      EXPORT_DIR: "/data/export"
      CERT_EXPIRY_WARN_DAYS: "30"
      # Dev-only placeholder keys so the dashboard/API/agent work out of the
      # box. Replace all three for anything beyond local development.
      API_KEY_READONLY: "dev-readonly-key"
      API_KEY_ADMIN: "dev-admin-key"
      API_KEY_AGENT: "dev-agent-key"
    volumes:
      # Generated by scripts/generate-demo-data.sh (real, throwaway, never
      # committed) so the agent below has an actual certificate to fetch.
      # Run that script once before `docker compose up`.
      - ./.demo/acme.json:/data/acme.json:ro
      - export-data:/data/export

  # Certificate Agent + Nginx, demonstrating the full manager -> agent ->
  # Nginx reload pipeline. Talks to the manager over plain HTTP on the
  # compose network (service name resolution) — see Dockerfile.agent /
  # deploy/agent for what runs inside this container.
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      - cds
    ports:
      - "8443:8443"
    environment:
      MANAGER_URL: "http://cds:8080"
      API_KEY: "dev-agent-key"
      DOMAINS: "agent-demo.example.com"
      POLL_INTERVAL_SECONDS: "10"
      INSTALL_DIR: "/etc/cds-agent/certs"

volumes:
  export-data:
