services:
  cds:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
      ACME_FILE: "/data/acme.json"
      EXPORT_DIR: "/data/export"
      CERT_EXPIRY_WARN_DAYS: "30"
    volumes:
      - ./examples/acme.sample.json:/data/acme.json:ro
      - export-data:/data/export

volumes:
  export-data:
